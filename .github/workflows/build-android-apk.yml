name: Build ZapMovies Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 5. Build Android Release APK
        id: build_apk
        working-directory: android
        run: |
          echo "Building APK with Gradle..."
          # Build release APK (signed with debug keystore for direct installation on physical phones)
          # If assembleRelease fails for any reason, automatically fall back to assembleDebug
          if ./gradlew assembleRelease --stacktrace; then
            echo "apk_type=release" >> $GITHUB_OUTPUT
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "Release build failed or lacked credentials, falling back to assembleDebug..."
            ./gradlew assembleDebug --stacktrace
            echo "apk_type=debug" >> $GITHUB_OUTPUT
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: 6. Verify APK was generated
        run: |
          echo "Looking for generated APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -ls

      - name: 7. Upload ZapMovies-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapMovies-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
